<!-- This is an SVG placeholder for the Soma Ko logo -->
<svg width="200" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E53E3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="25" fill="url(#logoGradient)"/>
  
  <!-- Food/delivery icon -->
  <path d="M20 20 L40 20 L35 35 L25 35 Z" fill="white"/>
  <circle cx="30" cy="25" r="3" fill="url(#logoGradient)"/>
  
  <!-- Text -->
  <text x="65" y="25" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#E53E3E">Soma Ko</text>
  <text x="65" y="40" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#FF8C00">Food Connect</text>
</svg>